<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<style>
    .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        box-shadow: 0px 0px 10px 2px #f2f2f2;
        border-radius: 1rem;
    }
</style>

<body>
    <nav>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROB71sId6ZHqZA2AdIlvKjQXif_w2hsFxH5PV5goTQAA&s=10"
            alt="" style="max-width: 100px; border-radius: 1rem;">
        <li>Option1</li>
        <li>Option2</li>
        <li>Option3</li>
        <li>Option4</li>
        <li>Option5</li>
        <button class="toggle-navbar">NavBar</button>
    </nav>
    <h1 id="heading1" class="heading">Heading - 1</h1>
    <h1 id="heading2" class="heading">Heading - 2</h1>
    <h1 id="heading3" class="heading">Heading - 3</h1>
    <h1 class="heading">Heading - 4</h1>
    <h1 class="heading">Heading - 5</h1>


    <input type="text" class="input" placeholder="Enter your name" />


    <div class="p-3 border-1 border-gray-200 rounded-xl mt-10 mx-3">
        <div class="flex justify-end">
            <button
                class="add-card cursor-pointer bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded">
                Add Card
            </button>
        </div>
        <br />
        <hr />
        <br />
        <div class="cards-grid grid grid-cols-3 gap-5">
            <div class="max-w-sm rounded overflow-hidden shadow-lg">
                <img class="w-full" src="https://v1.tailwindcss.com/img/card-top.jpg" alt="Sunset in the mountains">
                <div class="px-6 py-4">
                    <div class="font-bold text-xl mb-2">The Coldest Sunset</div>
                    <p class="text-gray-700 text-base">
                        Lorem ipsum dolor sit amet, consectetur adipisicing elit...
                    </p>
                </div>
                <div class="px-6 pt-4 pb-2">
                    <span
                        class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#photography</span>
                    <span
                        class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#travel</span>
                    <span
                        class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#winter</span>
                </div>
            </div>
        </div>
    </div>
</body>

<script type="module">
    async function getCardsData() {
        let res = await fetch("https://picsum.photos/v2/list?page=2");
        let data = await res.json();

        return data;
    }

    let cardsData = await getCardsData();

    // Get Elements
    var h1 = document.getElementById("heading1");
    console.log("document.getElementById('heading1'):   ", h1.textContent);


    h1 = document.getElementsByClassName("heading");
    console.log("\n\n\ndocument.getElementsByClassName('heading'):  ", h1);

    h1 = document.getElementsByTagName("h1");
    console.log("\n\n\ndocument.getElementsByTagName('h1'):  ", h1);

    h1 = document.querySelector("h1");
    console.log("\n\n\ndocument.querySelector('h1'):  ", h1.textContent);

    h1 = document.querySelectorAll(".heading");
    console.log("\n\n\ndocument.querySelector('.heading')...\n");
    h1.forEach(element => {
        console.log(element.textContent);
    });



    // Change properties of the HTML elements
    h1 = document.getElementById("heading1");
    h1.textContent = "Heading - 1 (updated using textContent)";

    var h2 = document.getElementById("heading2");
    h2.innerText = "Heading - 2 (updated using innerText)";

    var h3 = document.getElementById("heading3");
    h3.innerHTML = "<h2>Heading - 3 (updated using innerHTML) </h2>";

    h3.style.color = "red";
    h3.style.border = "2px solid #f2f2f2";
    h3.style.padding = "1rem 2rem";
    h3.style.borderRadius = "1rem";

    let nav = document.querySelector("nav");
    nav.classList.add("nav-bar");


    // Toogle nav-bar class and update image src on button click
    let toggleNavbar = document.querySelector(".toggle-navbar");
    let img = document.querySelector("img");

    toggleNavbar.addEventListener("click", function () {
        nav.classList.toggle("nav-bar");

        img.setAttribute("src", (nav.classList.contains("nav-bar")) ? "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROB71sId6ZHqZA2AdIlvKjQXif_w2hsFxH5PV5goTQAA&s=10" : "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhPFpGyCxuKpItjNjE814QDDDRPa0FNt0SdzsRrlCwqQ&s=10");
    });


    // Change Attributes
    let input = document.querySelector(".input");
    input.setAttribute("placeholder", "Username");



    // Add Cards
    var index = 0;
    let addCardBtn = document.querySelector(".add-card");

    function addCardIntoGrid() {
        let cardGrid = document.querySelector(".cards-grid");

        let card = document.createElement("div");
        card.classList.add("max-w-sm", "rounded", "overflow-hidden", "shadow-lg");
        card.innerHTML = `<img class="w-full max-h-40" src="${cardsData[index].download_url}" alt="${cardsData[index].author}">
                <div class="px-6 py-4">
                    <div class="font-bold text-xl mb-2">${cardsData[index].author}</div>
                    <p class="text-gray-700 text-base">
                        Lorem ipsum dolor sit amet, consectetur adipisicing elit...
                    </p>
                </div>
                <div class="px-6 pt-4 pb-2">
                    <span
                        class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#${cardsData[index].width}</span>
                    <span
                        class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#${cardsData[index].height}</span>
                    <span
                        class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">#ID${cardsData[index].id}</span>
                </div>`;
        cardGrid.appendChild(card);

        index++;
    }

    addCardBtn.addEventListener("click", function () {
        addCardIntoGrid();
    })
</script>

</html>
